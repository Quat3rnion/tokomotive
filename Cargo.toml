[package]
name = "tokomotive"
version = "0.1.0"
edition = "2024"
description = "LLM router and proxy with fallbacks, format translation and optional per-user cost accounting"
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
argon2 = "0.5"
base64 = "0.22"
anyhow = "1"
askama = "0.14"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
crc32fast = "1"
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"] }
metrics = "0.24"
multer = "3"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rsa = "0.9"
tempfile = "3"
