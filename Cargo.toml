[package]
name = "llm-accounting"
version = "0.1.0"
edition = "2024"
description = "LLM API proxy that accounts per-model cost, price and profit per user"
license = "MIT OR Apache-2.0"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
anyhow = "1"
askama = "0.14"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
