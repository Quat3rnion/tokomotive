{% extends "base.html" %}
{% block title %}Set up Tokomotive{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Set up Tokomotive</h1>
  <p>Choose a mode and set the dashboard password. You can change both later in Settings.</p>
  <form method="post" action="/setup" class="stack">
    <label>Owner username <input name="username" value="admin" autocomplete="username" maxlength="64" required></label>
    <fieldset class="choices">
      <legend>Mode</legend>
      <label class="choice"><input type="radio" name="mode" value="full" {% if mode != "simple" %}checked{% endif %} aria-describedby="mode-full-help"><span><b>Full Mode</b><span id="mode-full-help">Routes requests and records usage. Also applies pricing, Budgets and Rate Limits.</span></span></label>
      <label class="choice"><input type="radio" name="mode" value="simple" {% if mode == "simple" %}checked{% endif %} aria-describedby="mode-simple-help"><span><b>Simple Mode</b><span id="mode-simple-help">Routes requests and records token metrics only. The dashboard hides money.</span></span></label>
    </fieldset>
    <label>Password <input type="password" name="password" minlength="8" autocomplete="new-password" required aria-describedby="password-help"></label>
    <p class="hint" id="password-help" style="margin-top:calc(-1 * var(--sp-2))">Use at least 8 characters.</p>
    <label>Confirm password <input type="password" name="password_confirm" minlength="8" autocomplete="new-password" required></label>
    <div class="form-error" role="alert" tabindex="-1"></div>
    <button>Set up and log in</button>
  </form>
</div>
{% endblock %}
