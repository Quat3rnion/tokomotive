<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"[45]..","swap":true,"error":true}]}'>
<title>{% block title %}Tokomotive{% endblock %}</title>
<script src="/admin/assets/htmx.min.js"></script>
<style>
:root { --bg:#0f1115; --panel:#171a21; --line:#272b35; --text:#e6e8ee; --muted:#8a90a0; --accent:#3b82f6; --bad:#ef4444; --good:#10b981; --warn:#f59e0b; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
header { display:flex; align-items:center; gap:24px; padding:10px 24px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:1; }
header b { font-size:15px; }
header nav a { color:var(--muted); text-decoration:none; margin-right:16px; }
header nav a:hover, header nav a.on { color:var(--text); }
header form { margin-left:auto; }
main { padding:20px 24px; max-width:1400px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 16px; }
h2 { font-size:15px; margin:24px 0 8px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
a { color:var(--accent); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin-bottom:16px; }
.stat .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
.stat .v { font-size:22px; font-weight:600; margin:2px 0; font-variant-numeric:tabular-nums; }
.stat .s { color:var(--muted); font-size:12px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(520px, 1fr)); gap:16px; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { color:var(--muted); font-weight:500; font-size:12px; }
td.n, th.n { text-align:right; }
.scroll { overflow-x:auto; }
.muted { color:var(--muted); }
.tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; margin-left:4px; }
.tag.warn { background:#3b2f12; color:var(--warn); }
.tag.bad { background:#3b1414; color:var(--bad); }
.tag.info { background:#14233b; color:var(--accent); }
.bad { color:var(--bad); } .good { color:var(--good); }
input, select, textarea, button { font:inherit; color:var(--text); background:#0c0e12; border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
input[type=checkbox] { width:auto; }
textarea { width:100%; font-family:ui-monospace, monospace; }
button { background:var(--accent); border-color:var(--accent); cursor:pointer; }
button.ghost { background:transparent; color:var(--muted); }
button.danger { background:transparent; border-color:var(--bad); color:var(--bad); }
form.inline { display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap; margin:0; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
.row label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
.row label input { width:110px; }
.row label.check { flex-direction:row; align-items:center; gap:6px; align-self:center; color:var(--text); font-size:14px; }
.row label.check input { width:auto; }
.row label input.wide { width:220px; }
fieldset.deployments { border:0; padding:0; margin:12px 0; min-width:0; }
fieldset.deployments legend { padding:0; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
fieldset.deployments > .muted { margin:4px 0 8px; font-size:12px; }
.deployment { margin-bottom:8px; }
.deployment select { min-width:160px; }
.panel.scroll table { font-size:13px; }
.tabs a { margin-right:12px; text-decoration:none; color:var(--muted); }
.tabs a.on { color:var(--text); border-bottom:2px solid var(--accent); }
.notice { border-left:3px solid var(--good); padding:8px 12px; background:#10251d; margin-bottom:16px; }
.secret { font-family:ui-monospace, monospace; font-size:15px; padding:10px; background:#0c0e12; border:1px dashed var(--warn); border-radius:6px; user-select:all; }
svg.chart { width:100%; height:auto; }
svg .grid { stroke:var(--line); }
svg .axis { fill:var(--muted); font-size:11px; }
.legend span { margin-right:14px; font-size:12px; color:var(--muted); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
</style>
</head>
<body>
{% block header %}
<header>
  <b>Tokomotive</b>
  {% if base.simple %}<span class="muted">Simple mode</span>{% endif %}
  <nav>
    <a href="/admin" {% block nav_overview %}{% endblock %}>Overview</a>
    <a href="/admin/users" {% block nav_users %}{% endblock %}>Users</a>
    <a href="/admin/teams" {% block nav_teams %}{% endblock %}>Teams</a>
    <a href="/admin/keys" {% block nav_keys %}{% endblock %}>Keys</a>
    <a href="/admin/models" {% block nav_models %}{% endblock %}>Models</a>
    <a href="/admin/ledger" {% block nav_ledger %}{% endblock %}>Ledger</a>
    <a href="/admin/providers" {% block nav_providers %}{% endblock %}>Providers</a>
    <a href="/admin/routes" {% block nav_routes %}{% endblock %}>Routes</a>
    <a href="/admin/settings" {% block nav_settings %}{% endblock %}>Settings</a>
  </nav>
  <form method="post" action="/admin/logout"><button class="ghost">Log out</button></form>
</header>
{% endblock %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
