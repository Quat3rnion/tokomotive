<details data-secret-picker><summary>Choose a secret from a store</summary>
  <p class="hint">Choose a store, a secret and a field. <a href="/admin/settings/secrets">Manage Secret stores</a>.</p>
  <div class="fields">
    <label class="field">Secret store <select data-secret-stores><option value="">Choose a store</option></select></label>
    <label class="field">Search secrets <input type="search" data-secret-search autocomplete="off"></label>
    <label class="field">Secret <select data-secret-items><option value="">Choose a secret</option></select></label>
    <label class="field">Field <select data-secret-fields><option value="">Choose a field</option></select></label>
  </div>
  <div class="row"><button type="button" class="ghost" data-secret-back>Store root</button><button type="button" class="ghost" data-secret-next disabled>Next page</button><button type="button" class="ghost" data-secret-test>Test</button></div>
  <p data-secret-status role="status"></p>
  <details><summary>Advanced: raw reference</summary><label class="field">Secret reference <input name="secret_reference" data-secret-reference autocomplete="off" spellcheck="false" placeholder="vault@prod:kv/llm#openai"></label></details>
</details>
