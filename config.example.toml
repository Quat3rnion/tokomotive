# tokomotive optional seed configuration. No file is required.
#
# Pass --config PATH to use this file. Providers, routes and server/router
# settings seed once, on the first start. Later edits belong in the dashboard.
# The proxy adds Models, cards, Teams
# and Users that are not in the database yet. It does not overwrite changes
# that you made in the dashboard.
#
# All rates are USD per million tokens. The rates below are the Provider
# list prices on 2026-10-24, from:
#   https://developers.openai.com/api/docs/pricing
#   https://platform.claude.com/docs/en/about-claude/pricing
# Check them again before you use them.

[server]
# Binding and storage use --listen/--database or the corresponding environment
# variables, not this file. Defaults: 127.0.0.1:8787 and sqlite://tokomotive.db.
# The dashboard password. The environment variable has priority.
admin_password_env = "TOKOMOTIVE_ADMIN_PASSWORD"
# Markup for Models that have no Price Card.
default_markup_percent = 20
upstream_timeout_secs = 600
# When set, /metrics needs "Authorization: Bearer <token>".
metrics_token_env = "TOKOMOTIVE_METRICS_TOKEN"
# Output tokens that a Budget reservation assumes when a request sets no
# max_tokens.
reserve_output_tokens = 4096
# Dashboard login duration.
session_days = 7
mode = "full" # "simple" records usage without Budget checks or Rate Limits.

# Initial router settings. Use Settings in the dashboard for live changes.
[router]
failure_threshold = 3
cooldown_secs = 30
max_attempts = 8
session_affinity_ttl_secs = 1800
session_affinity_capacity = 100000
adaptive_epsilon = 0.05
adaptive_half_life = 10.0 # Samples, not seconds.
adaptive_prior_decay_minutes = 5.0

# Optional client-facing model name. Strategies: priority (default),
# round_robin, weighted, quota, adaptive. Adaptive learns success and latency.
# Weighted picks one deployment at random first,
# then tries the others in descending weight order.
# [[routes]]
# name = "smart"
# strategy = "priority"
# session_affinity = false # Keep each conversation on one Deployment for KV reuse.
# deployments = [{ provider = "openai", model = "gpt-4o", weight = 1 }]
# fallbacks = ["gpt-4o-mini"]
# Fallbacks are route names or catalog Model names. They are allowed
# implicitly when a Virtual Key allows the primary route. Unknown names
# are skipped with a warning. Fallbacks do not expand recursively.

[[providers]]
name = "openai"
kind = "openai"
base_url = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"
# A key pool: the proxy uses the keys in turn, and tries the next key after a
# 429, a 5xx or a connection error.
# api_keys_env = ["OPENAI_API_KEY_2", "OPENAI_API_KEY_3"]

[[providers]]
name = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# A Model also matches dated names that start with "<name>-",
# for example "gpt-4o-2024-08-06". The longest matching name wins.

# ---- OpenAI

[[models]]
name = "gpt-6.1-sol"
provider = "openai"
cost = { input = 2.00, output = 10.00, cache_read = 0.10 }

[[models]]
name = "gpt-6-luna"
provider = "openai"
cost = { input = 0.10, output = 0.50, cache_read = 0.01 }
price = { input = 0.20, output = 1.00, cache_read = 0.02 }

[[models]]
name = "gpt-4o"
provider = "openai"
cost = { input = 2.50, output = 10.00, cache_read = 1.25 }

[[models]]
name = "gpt-4o-mini"
provider = "openai"
cost = { input = 0.15, output = 0.60, cache_read = 0.075 }

[[models]]
name = "text-embedding-3-small"
provider = "openai"
cost = { input = 0.02 }

[[models]]
name = "text-embedding-3-large"
provider = "openai"
cost = { input = 0.13 }

# Image generation: text input, cached text input, image input and image
# output have different rates.
[[models]]
name = "gpt-image-2"
provider = "openai"
cost = { input = 5.00, cache_read = 1.25, image_input = 8.00, image_output = 30.00 }

# ---- Anthropic

[[models]]
name = "claude-opus-5-5"
provider = "anthropic"
cost = { input = 4.00, output = 20.00, cache_read = 0.20, cache_write_5m = 5.00, cache_write_1h = 8.00 }

[[models]]
name = "claude-sonnet-5-5"
provider = "anthropic"
price = { markup_percent = 25 }
cost = { input = 2.00, output = 10.00, cache_read = 0.10, cache_write_5m = 2.50, cache_write_1h = 4.00 }

# Haiku 5.5 has higher rates when the prompt, including cache tokens, is
# more than 100,000 tokens.
[[models]]
name = "claude-haiku-5-5"
provider = "anthropic"

[models.cost]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20

[[models.cost.tiers]]
above_input_tokens = 100000
input = 0.50
output = 2.50
cache_read = 0.05
cache_write_5m = 0.625
cache_write_1h = 1.00

[[teams]]
name = "acme"
price_overrides = [{ model = "gpt-4o", markup_percent = 50 }]

[[users]]
name = "alice"
team = "acme"
budget_usd = 100.0
budget_monthly = true
# Development only: create this Virtual Key at start.
keys = ["sk-dev-alice-change-me"]

[[users]]
name = "bob"
